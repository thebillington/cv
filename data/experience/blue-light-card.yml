company: Blue Light Card
title: Full Stack Engineer
start: 2026-02
end: present
team: Growth and Engagement

summary: >-
  I own the member data platform: signup, eligibility, login and renewals, across
  the private member data store, the member service and Auth0. It serves 16
  million requests per day through API Gateway and serverless Lambdas. I keep the
  members service and Auth0 compliant with our retention, right to erasure and
  subject access requirements, including S3 retention for member document uploads.
  I lead the Engagement Pod, in a squad of 10 engineers and 2 QE.

stack:
  - TypeScript
  - Python
  - AWS
  - Terraform Cloud
  - API Gateway
  - Lambda
  - DynamoDB
  - PostgreSQL
  - Valkey
  - Auth0
  - GitHub Actions
  - Cloudflare

achievements:
  - title: Extracted the members service from the monorepo
    description: >-
      Wrote the RFC, then built the standalone repository, the Terraform stack on
      Terraform Cloud and GitHub Actions pipelines deploying to AWS and
      Cloudflare. Added an endpoint parity suite covering all API endpoints,
      designed the monitoring and a rollback path shared with the on call team,
      and it reached 100% of production traffic with no rollback needed.
    impact: high
    include_pdf: true
    tags:
      - architecture
      - terraform
      - aws
      - platform
      - migration
      - testing

  - title: Led the PHP CVE response
    description: >-
      We were on PHP 7.3 with no upgrade path, so over 29 hours I moved members
      from the PHP database proxy onto the admin backend service, replacing the
      PHP functionality with Lambda to Lambda calls, then switched PHP off. With
      another engineer I removed the PHP auth route from the web app and the
      monorepo, and disabled the reverse proxy that exposed the legacy routes.
    impact: high
    include_pdf: true
    tags:
      - incident
      - security
      - migration
      - architecture
      - aws

  - title: Managed the switch off of the legacy apps
    description: >-
      Leadership buy in was difficult, so I built pipelines that ran scripts
      against the database and Auth0 from templates on ephemeral EC2, so every
      change was auditable and within rate limits. Identified members still
      signing in through Cognito and the PHP routes and moved them to Auth0, with
      CRM comms and automated password resets. It was the direct enabler of the
      PHP cutover.
    impact: high
    include_pdf: true
    tags:
      - migration
      - auth0
      - cognito
      - delivery
      - stakeholder-management

  - title: Set the team's standard for AI assisted work
    description: >-
      Built MCP servers for CloudWatch investigations into Grafana dashboards and
      for delegating work to local models, plus a shared document store. Trained
      the team on using them.
    impact: high
    include_pdf: true
    tags:
      - ai
      - leadership
      - automation
      - security

  - title: Ran the forced update rollout
    description: >-
      Worked with CRM and external stakeholders and used revenue and operational
      cost data to get leadership buy in, on work that had to go right first time.
    impact: high
    tags:
      - delivery
      - stakeholder-management
      - mobile

  - title: Built the retention and deletion controls for member data
    description: >-
      Implemented right to erasure and subject access request handling, retention
      policies for the member data store, and S3 lifecycle and deletion rules for
      member document uploads.
    impact: high
    include_pdf: false
    tags:
      - gdpr
      - data
      - security
      - compliance

  - title: Built a UI for validating API changes
    description: >-
      Deploys feature branches to dev, runs the test suite against new and
      staging code, and writes a diff report with an agent ready README.
    impact: medium
    include_pdf: false
    tags:
      - testing
      - automation
      - ai

  - title: Validated data migrations across three brands
    description: >-
      Wrote Python scripts that diffed thousands of employer records between the
      legacy JSON store and the PostgreSQL database, finding and fixing
      inconsistencies before release.
    impact: high
    include_pdf: false
    tags:
      - python
      - data
      - migration

  - title: Replaced SSO tokens in the AU deployment pipeline
    description: >-
      Swapped long lived PATs for ephemeral GitHub Actions tokens, removing a
      manual rotation step that had to happen every three days.
    impact: medium
    include_pdf: false
    tags:
      - devops
      - github-actions
      - security

  - title: Ran mob sessions through the renewals rebuild
    description: >-
      Organised collaborative sessions during the renewals decoupling and
      rebuild, raising delivery quality and building shared ownership across the
