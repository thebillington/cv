team: Growth and Engagement

summary: >-
  Owns the member data platform: signup, eligibility, login and renewals, across
  the private member data store, the member service and Auth0. It serves 16
  million requests per day through API Gateway and serverless Lambdas. Manages
  retention policies for member data, GDPR right to erasure and subject access
  requests, and S3 retention for member document uploads.

