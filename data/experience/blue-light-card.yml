company: Blue Light Card
title: Full Stack Engineer
start: 2026-02
end: present

summary: >
  Full Stack Engineer within the Growth & Engagement team, owning
  authentication and member services. Driving technical decisions across
  architecture, quarterly planning and delivery for strategic platform
  initiatives. Led the extraction of the Members service from a legacy
  monorepo into a standalone repository and infrastructure stack, establishing
  the foundation for future globalisation efforts and retirement of legacy PHP
  services. Delivered dedicated infrastructure, deployment pipelines, migration
  tooling and operational runbooks while coordinating rollout strategies
  including traffic splitting and rollback planning. Improved platform
  reliability by optimising Auth0 integrations, reducing dependency on
  downstream services through JWT claim enrichment and delivering secure
  native-to-web session transfer capabilities. Built automation and data
  validation tooling supporting large-scale migrations and platform
  modernisation efforts. Established AI adoption policy and tooling standards
  to de-risk the transition to AI-assisted development, built custom MCP
  servers delegating tasks to local open-source LLMs to reduce token spend,
  and created tooling for automated CloudWatch investigations, Grafana
  dashboard generation and API changes validation with agent-targeted
  documentation.

