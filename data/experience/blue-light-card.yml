company: Blue Light Card
title: Full Stack Engineer
start: 2026-02
end: present
team: Growth and Engagement

summary: >-
  I own the member data platform: signup, eligibility, login and renewals, across
  the private member data store, the member service and Auth0. It serves 16
  million requests per day through API Gateway and serverless Lambdas. I also own
  retention, GDPR erasure and subject access requests, and S3 retention for
  member document uploads. The squad is 10 engineers and 2 QE; I now lead a pod
  of two full-stack and four mobile engineers.

stack:
  - TypeScript
  - Python
  - AWS
  - Terraform Cloud
  - API Gateway
  - Lambda
  - DynamoDB
  - PostgreSQL
  - Valkey
  - Auth0
  - GitHub Actions
  - Cloudflare

achievements:
  - title: Extracted the members service from the monorepo
    description: >-
      Wrote the RFC, then built the standalone repository, the Terraform stack on
      Terraform Cloud and GitHub Actions pipelines deploying to AWS and
      Cloudflare. Added an endpoint parity suite covering all API endpoints and
      wrote a runbook so other developers could run similar migrations. It
      reached 100% of production traffic without a rollback.
    impact: high
    include_pdf: true
    tags:
      - architecture
      - terraform
      - aws
      - platform
      - migration
      - testing

  - title: Led the PHP CVE response
    description: >-
      We were on PHP 7.3 with no upgrade path, so over 29 hours I moved members
      from the PHP database proxy onto the admin backend service, replacing the
      PHP functionality with Lambda-to-Lambda calls, then switched PHP off. With
      another engineer I removed the PHP auth route from the web app and the
      monorepo, and disabled the reverse proxy that exposed the legacy routes.
    impact: high
    include_pdf: true
    tags:
      - incident
      - security
      - migration
      - architecture
      - aws

  - title: Managed the switch-off of the legacy apps
    description: >-
      Identified members still signing in through Cognito and the PHP routes and
      migrated them to Auth0, worked with CRM on the comms and triggered
      automated password resets. It was the direct enabler of the PHP cutover.
    impact: high
    include_pdf: true
    tags:
      - migration
      - auth0
      - cognito
      - delivery
      - stakeholder-management

  - title: Built the retention and deletion controls for member data
    description: >-
      Implemented right to erasure and subject access request handling, retention
      policies for the member data store, and S3 lifecycle and deletion rules for
      member document uploads.
    impact: high
    include_pdf: true
    tags:
      - gdpr
      - data
      - security
      - compliance

  - title: Set the squad's standard for AI-assisted work
    include_pdf: false
