      Defined the documentation process, shared configs with the wider team and
      set the rules for handling proprietary code. Built two MCP servers: one for
      CloudWatch investigations into Grafana dashboards, one that sends small
      implementation tasks to a local Qwen3 30B model to cut token spend.
    impact: high
    tags:
      - ai
      - leadership
      - automation
      - security

  - title: Built a UI for validating API changes
    description: >-
      Deploys feature branches to dev, runs the test suite against new and
