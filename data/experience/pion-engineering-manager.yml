company: Pion
title: Engineering Manager
start: 2022-01
end: 2025-06

summary: >
  Engineering Manager responsible for engineering effectiveness, platform
  initiatives and operational excellence across multiple squads. Developed
  Python-based analytics pipelines to surface DORA and SPACE metrics from
  GitLab data, enabling data-driven improvements to engineering performance.
  Led engineering delivery for ISO27001 compliance, introducing automated
  vulnerability reporting and security monitoring processes. Built reusable
  backend and frontend service templates to accelerate development and improve
  consistency across teams. Redesigned incident management practices,
  introducing structured reporting and blameless post-mortems that improved
  operational maturity and learning across the organisation.

