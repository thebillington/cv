# Skills, in two shapes:
#
#   core       the four to six lines that appear in the PDF. Hard, searchable
#              terms only: nothing that cannot be evidenced in the roles.
#              Quoted so each line stays a string ("Label: values").
#   categories the full matrix, used by the website only.
#
# Order matters. The first line of each is the one a keyword search hits.

core:
  - "Languages: TypeScript, Python, Kotlin, Swift, Java"
  - "Frontend: React, Next.js, Tailwind, HTML/CSS"
  - "Backend: Node.js, REST, OpenAPI, Lambda, Auth0, Cognito"
  - "Platform: AWS, Terraform, GitHub Actions, CI/CD, CloudWatch, Grafana"
  - "Mobile: Android (Kotlin), iOS (Swift)"
  - "Practice: service extraction, data migration, automated testing, incident response, mentoring"

