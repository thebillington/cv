# Skills, in two shapes:
#
#   core       the lines that appear in the PDF. Hard, searchable terms only,
#              and only things with professional use.
#   categories the full matrix, used by the website only.

core:
  - "Languages: TypeScript, Python, Swift, Kotlin"
  - "Frontend: Next.js, React, Tailwind, HTML/CSS"
  - "Backend: Node.js, REST, API Gateway, Lambda, Auth0"
  - "Data: PostgreSQL, DynamoDB, Valkey (Redis)"
  - "Platform: AWS, Terraform (HCL), Terraform Cloud, GitHub Actions, Cloudflare"
  - "Mobile: native Android (Kotlin), native iOS (Swift)"
  - "Practice: migrations, contract and parity testing, incident response, mentoring"

