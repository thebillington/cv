summary: I am a Full Stack Engineer with a background in Management and Education. I am proficient with modern stacks across the spectrum and am comfortable working in Backend and Frontend codebases across mobile and web as well as managing the IaC and CI/CD pipelines for builds and deployments. I work with AI tooling day to day and build the tooling the team uses, from MCP servers to local models. In my current role at Blue Light Card I lead the Engagement Pod and own the Auth0 and members service, handling 16 million requests per day.
