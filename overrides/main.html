{% extends "base.html" %}

{% block extrahead %}
  <link rel="icon" type="image/png" sizes="512x512" href="{{ 'assets/favicon.png' | url }}">
  <link rel="icon" type="image/x-icon" href="{{ 'assets/favicon.ico' | url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="https://billy.rebecchi.uk/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Billy Rebecchi, Senior Full Stack Engineer at Blue Light Card">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:locale" content="en_GB">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ config.site_name }}">
  <meta name="twitter:description" content="{{ config.site_description }}">
  <meta name="twitter:image" content="https://billy.rebecchi.uk/assets/og-image.png">
  <meta name="twitter:image:alt" content="Billy Rebecchi, Senior Full Stack Engineer at Blue Light Card">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ config.extra.person.name | tojson }},
    "url": {{ config.site_url | tojson }},
    "image": "https://billy.rebecchi.uk/assets/og-image.png",
    "jobTitle": {{ config.extra.person.title | tojson }},
    "description": {{ config.extra.person.description | tojson }},
    "email": {{ config.extra.person.email | tojson }},
    "sameAs": [
      {{ config.extra.person.github | tojson }},
      {{ config.extra.person.linkedin | tojson }}
    ]
  }
  </script>
{% endblock %}
