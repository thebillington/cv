site_name: Billy Rebecchi
site_description: "Full Stack Software Engineer and Engineering Manager. TypeScript, Python, Kotlin, AWS and Terraform."
site_url: https://billy.rebecchi.uk/
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/cv.css

exclude_docs: |
  research/
  design/
  reviews/
  interview/
  pipeline.md
  _*.txt

nav:
  - About: index.md
  - Experience: experience.md
  - Projects: projects.md
  - Skills: skills.md
  - Education: education.md
  - Download CV: __CV_PDF__

extra:
  generator: false
  person:
    name: Billy Rebecchi
    email: billy.rebecchi@googlemail.com
    title: Senior Software Engineer
    description: "Software engineer with seven years building and modernising production systems in TypeScript, Python and Kotlin."
    github: https://github.com/thebillington
    linkedin: https://linkedin.com/in/thebillington

plugins:
  - search
  - macros:
      module_name: main
